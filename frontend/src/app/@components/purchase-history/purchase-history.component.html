<h1>進貨紀錄</h1>

<div class="history-filter-row">
  <input type="text" placeholder="搜尋訂單編號或供應商" [(ngModel)]="recordKeyword" />

  <select [(ngModel)]="selectedOriginCountry">
    <option value="">全部來源國</option>
    <option value="JP">JP 日本</option>
    <option value="TW">TW 台灣</option>
  </select>

  <input type="date" [(ngModel)]="startDate" (change)="onDateChange()" />

  <input type="date" [(ngModel)]="endDate" (change)="onDateChange()" [min]="startDate" />
</div>

<div class="date-error-message" *ngIf="dateErrorMessage">
  {{ dateErrorMessage }}
</div>

<div class="card">

  <table>

    <thead>
      <tr>
        <th>訂單編號</th>
        <th>建立時間</th>
        <th>商品總額</th>
        <th>進口稅</th>
        <th>營業稅</th>
        <th>到岸成本</th>
        <th>操作</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let order of filteredOrders()">

        <td data-label="訂單編號">
          <button type="button" class="order-link" (click)="openOrderDetail(order.id)">
            {{ order.orderNo }}
          </button>
        </td>

        <td data-label="建立時間">
          {{ order.createdAt | date:'yyyy/MM/dd HH:mm' }}
        </td>

        <td data-label="商品總額">
          NT$ {{ order.subtotal | number }}
        </td>

        <td data-label="進口稅">
          NT$ {{ order.dutyTotal | number }}
        </td>

        <td data-label="營業稅">
          NT$ {{ order.vatTotal | number }}
        </td>

        <td data-label="到岸成本">
          NT$ {{ order.landedCostTotal | number }}
        </td>

        <td data-label="操作" class="action-cell">
          <button type="button" class="detail-btn" (click)="openOrderDetail(order.id)">
            明細
          </button>

          <button type="button" class="delete-btn" (click)="deleteOrder(order.id)">
            刪除
          </button>
        </td>

      </tr>

      <tr *ngIf="filteredOrders().length === 0">
        <td colspan="8" class="empty-row">
          查無進貨紀錄
        </td>
      </tr>

    </tbody>

  </table>

</div>
