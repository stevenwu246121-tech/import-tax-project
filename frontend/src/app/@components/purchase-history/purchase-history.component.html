<h1>進貨紀錄</h1>

<div class="card">

  <table>

    <thead>
      <tr>
        <th>訂單編號</th>
        <th>建立時間</th>
        <th>商品總額</th>
        <th>進口稅</th>
        <th>營業稅</th>
        <th>到岸成本</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let order of orders">

        <td data-label="訂單編號">
          <button
            type="button"
            class="order-link"
            (click)="openOrderDetail(order.id)"
          >
            {{ order.orderNo }}
          </button>
        </td>

        <td data-label="建立時間">
          {{ order.createdAt | date:'yyyy/MM/dd HH:mm' }}
        </td>

        <td data-label="商品總額">
          NT$ {{ order.subtotal | number }}
        </td>

        <td data-label="進口稅">
          NT$ {{ order.dutyTotal | number }}
        </td>

        <td data-label="營業稅">
          NT$ {{ order.vatTotal | number }}
        </td>

        <td data-label="到岸成本">
          NT$ {{ order.landedCostTotal | number }}
        </td>

      </tr>

    </tbody>

  </table>

</div>
