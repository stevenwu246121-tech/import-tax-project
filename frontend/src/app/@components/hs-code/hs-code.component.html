<h1>HS Code 管理</h1>

<section class="panel">

  <h2>食品類 HS Code 對照表</h2>

  <div class="search-filter-row">
    <input type="text" placeholder="搜尋 HS Code / 商品 / 分類" [(ngModel)]="keyword" (input)="search()" />
  </div>

  <div class="form-card">

    <input type="text" placeholder="HS Code" [(ngModel)]="hsCodeReq.code" />

    <input type="text" placeholder="商品名稱" [(ngModel)]="hsCodeReq.name" />

    <select [(ngModel)]="hsCodeReq.categoryId">
    <option [ngValue]="null" disabled>選擇分類</option>

    <option *ngFor="let category of categories" [ngValue]="category.id">
    {{ category.name }}
    </option>
    </select>

    <input type="number"
    min="0"
    placeholder="進口稅"
    [(ngModel)]="hsCodeReq.dutyRate" />

    <input type="number"
    min="0"
    placeholder="進口營業稅"
    [(ngModel)]="hsCodeReq.vatRate" />

    <input type="text" placeholder="說明" [(ngModel)]="hsCodeReq.description" />

    <button (click)="submitHsCode()">
      {{ editingHsCodeId ? '更新 HS Code' : '新增 HS Code' }}
    </button>

  </div>

  <table>
    <thead>
      <tr>
        <th>HS Code</th>
        <th>商品類型</th>
        <th>分類</th>
        <th>進口稅</th>
        <th>進口營業稅</th>
        <th>說明</th>
        <th>操作</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of filteredHsCodes">
        <td>{{ item.code }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.categoryName }}</td>
        <td>{{ item.dutyRate }}%</td>
        <td>{{ item.vatRate }}%</td>
        <td>{{ item.description }}</td>

        <td class="action-cell">

          <button class="edit-menu-btn" (click)="toggleActionMenu(item.id)">
            編輯
          </button>

          <div class="action-menu" *ngIf="openedActionId === item.id">

            <button class="action-update" (click)="editHsCode(item); openedActionId = null">
              修改
            </button>

            <button class="action-delete" (click)="deleteHsCode(item.id); openedActionId = null">
              刪除
            </button>

          </div>

        </td>
      </tr>
    </tbody>
  </table>

</section>
