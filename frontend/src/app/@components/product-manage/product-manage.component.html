<h1>
  商品管理
</h1>

<div class="search-filter-row">

  <input type="text" placeholder="搜尋商品名稱" [(ngModel)]="keyword" />

  <select [(ngModel)]="selectedCategory">

    <option value="">
      全部分類
    </option>

    <option *ngFor="let category of categories" [value]="category.name">
      {{ category.name }}
    </option>

  </select>

</div>


<div class="form-card">

  <input type="text" placeholder="商品名稱" [(ngModel)]="productReq.name" (change)="onProductNameChange()" />

  <select [(ngModel)]="productReq.categoryId" (change)="onCategoryChange()">
    <option *ngFor="let category of categories" [ngValue]="category.id">
      {{ category.name }}
    </option>
  </select>

  <select [(ngModel)]="productReq.hsCodeId">
    <option *ngFor="let hsCode of filteredHsCodes" [ngValue]="hsCode.id">
      {{ hsCode.code }} - {{ hsCode.name }}
    </option>
  </select>

  <select [(ngModel)]="productReq.originCountry">
    <option value="">選擇來源國</option>
    <option value="JP">JP</option>
    <option value="TW">TW</option>
  </select>

  <input type="text" placeholder="單位" [(ngModel)]="productReq.unit" />

  <input type="number" placeholder="單價" [(ngModel)]="productReq.unitPrice" />

  <button (click)="submitProduct()">
    {{ editingProductId ? '更新商品' : '新增商品' }}
  </button>

</div>

<table>

  <thead>

    <tr>

      <th>商品</th>

      <th>分類</th>

      <th>HS Code</th>

      <th>價格</th>

      <th>操作</th>

    </tr>

  </thead>

  <tbody>

    <tr *ngFor="let product of filteredProducts()">
      <td>
        {{ product.productName }}
      </td>

      <td>
        {{ product.categoryName }}
      </td>

      <td>
        {{ product.hsCode }}
      </td>

      <td>
        {{ product.unitPrice }}
      </td>

      <td class="action-cell">

        <button class="edit-menu-btn" (click)="toggleActionMenu(product.id)">
          編輯
        </button>

        <div class="action-menu" *ngIf="openedActionId === product.id">

          <button class="action-update" (click)="editProduct(product); openedActionId = null">
            修改
          </button>

          <button class="action-delete" (click)="deleteProduct(product.id); openedActionId = null">
            刪除
          </button>

        </div>

      </td>

    </tr>

  </tbody>

</table>
