<h1>商品管理</h1>

<div class="search-filter-row">
  <input type="text" placeholder="搜尋商品名稱" [(ngModel)]="keyword" />

  <select [(ngModel)]="selectedCategory">
    <option value="">全部分類</option>

    <option *ngFor="let category of categories" [value]="category.name">
      {{ category.name }}
    </option>
  </select>
</div>

<div class="form-card">
  <!-- 商品名稱 + 自動推薦 HS Code -->
  <div class="product-name-row">
    <input type="text" placeholder="商品名稱" maxlength="30" [(ngModel)]="productReq.name" />

    <button type="button" class="recommend-btn" (click)="recommendHsCode()">
      自動推薦 HS Code
    </button>
  </div>

  <!-- 推薦訊息 -->
  <div class="recommend-message" *ngIf="recommendMessage">
    {{ recommendMessage }}
  </div>

  <!-- 分類 -->
  <select [(ngModel)]="productReq.categoryId" (change)="onManualCategoryChange()">
    <option [ngValue]="0" disabled>
      請選擇分類
    </option>

    <option *ngFor="let category of categories" [ngValue]="category.id">
      {{ category.name }}
    </option>
  </select>

  <!-- HS Code -->
  <select [(ngModel)]="productReq.hsCodeId" (change)="onManualHsCodeChange()">
    <option [ngValue]="0" disabled>
      請選擇 HS Code
    </option>

    <option *ngFor="let hsCode of filteredHsCodes" [ngValue]="hsCode.id">
      {{ hsCode.code }} - {{ hsCode.name }}
    </option>
  </select>

  <!-- 來源國 -->
  <select [(ngModel)]="productReq.originCountry">
    <option value="" disabled>
      請選擇來源國
    </option>

    <option value="JP">JP</option>
    <option value="TW">TW</option>
  </select>

  <!-- 單位 -->
  <input type="text" placeholder="單位" maxlength="5" [(ngModel)]="productReq.unit" />

  <!-- 單價 -->
  <input type="number" placeholder="單價" min="1" [(ngModel)]="productReq.unitPrice" />

  <!-- 庫存數量 -->
  <input type="number" min="0" placeholder="庫存數量" [(ngModel)]="productReq.stockQty" />

  <!-- 新增 / 更新商品 -->
  <button type="button" class="submit-btn" (click)="submitProduct()">
    {{ editingProductId ? '更新商品' : '新增商品' }}
  </button>
</div>

<div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th>商品</th>
        <th>分類</th>
        <th>HS Code</th>
        <th>價格</th>
        <th>庫存</th>
        <th>操作</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let product of filteredProducts()">
        <td>
          <span class="product-name" [title]="product.productName">
            {{ product.productName }}
          </span>
        </td>

        <td>
          {{ product.categoryName }}
        </td>

        <td>
          {{ product.hsCode }}
        </td>

        <td>
          NT$ {{ product.unitPrice | number }}
        </td>

        <td>
          <span class="stock-badge" [class.low-stock]="product.stockQty <= 10">
            {{ product.stockQty }}
          </span>

          <span class="low-stock-text" *ngIf="product.stockQty <= 10">
            低庫存
          </span>
        </td>

        <td class="action-cell">
          <button type="button" class="edit-menu-btn" (click)="toggleActionMenu(product.id)">
            編輯
          </button>

          <div class="action-menu" *ngIf="openedActionId === product.id">
            <button type="button" class="action-update" (click)="editProduct(product); openedActionId = null">
              修改
            </button>

            <button type="button" class="action-delete" (click)="deleteProduct(product.id); openedActionId = null">
              刪除
            </button>
          </div>
        </td>
      </tr>

      <tr *ngIf="filteredProducts().length === 0">
        <td colspan="6" class="empty-row">
          查無商品資料
        </td>
      </tr>
    </tbody>
  </table>
</div>
