<h1>庫存管理</h1>

<div class="search-filter-row">
  <input type="text" placeholder="搜尋商品名稱" [(ngModel)]="keyword" />

  <select [(ngModel)]="selectedCategory">
    <option value="">全部分類</option>

    <option *ngFor="let category of uniqueCategories" [value]="category.name">
      {{ category.name }}
    </option>
  </select>

  <select class="product-sort-select" [(ngModel)]="selectedProductSort">
    <option value="latestPurchase">
      最新進貨優先
    </option>

    <option value="stockAsc">
      庫存低到高
    </option>

    <option value="stockDesc">
      庫存高到低
    </option>

    <option value="priceDesc">
      價格高到低
    </option>

    <option value="priceAsc">
      價格低到高
    </option>

    <option value="nameAsc">
      商品名稱排序
    </option>
  </select>
</div>

<div class="form-card">
  <!-- 商品名稱 + 自動推薦 HS Code -->
  <div class="product-name-row">
    <input type="text" placeholder="商品名稱" maxlength="30" [(ngModel)]="productReq.name" (input)="onProductNameInput()" />

    <button type="button" class="recommend-btn" (click)="recommendHsCode()">
      自動推薦 HS Code
    </button>
  </div>

  <!-- 推薦訊息 -->
  <div class="recommend-message" *ngIf="recommendMessage">
    {{ recommendMessage }}
  </div>

  <!-- 分類 -->
  <select [(ngModel)]="productReq.categoryId" (change)="onManualCategoryChange()">
    <option [ngValue]="null" disabled>
      請選擇分類
    </option>

    <option *ngFor="let category of uniqueCategories" [ngValue]="category.id">
      {{ category.name }}
    </option>
  </select>

  <!-- HS Code -->
  <div class="hs-code-field">
    <select class="hs-code-select" [(ngModel)]="productReq.hsCodeId" (change)="onManualHsCodeChange()"
      [title]="getSelectedHsCodeTitle()">
      <option [ngValue]="null" title="請選擇 HS Code">
        請選擇 HS Code
      </option>

      <option *ngFor="let hs of filteredHsCodes" [ngValue]="hs.id" [title]="getHsCodeFullText(hs)">
        {{ formatHsCodeOption(hs) }}
      </option>
    </select>
  </div>

  <!-- 來源國 -->
  <select [(ngModel)]="productReq.originCountry">
    <option value="" disabled>
      請選擇來源國
    </option>

    <option value="JP">JP</option>
    <option value="TW">TW</option>
  </select>

  <!-- 單位 -->
  <select [(ngModel)]="productReq.unit">
    <option value="" disabled>
      請選擇數量單位
    </option>

    <option value="kg">
      公斤 kg
    </option>

    <option value="g">
      公克 g
    </option>

    <option value="包">
      包
    </option>

    <option value="盒">
      盒
    </option>

    <option value="瓶">
      瓶
    </option>

    <option value="袋">
      袋
    </option>
  </select>

  <!-- 單價 -->
  <input type="number" placeholder="單價" min="1" [(ngModel)]="productReq.unitPrice" />

  <!-- 庫存數量 -->
  <input type="number" placeholder="庫存數量" min="0" [(ngModel)]="productReq.stockQty" />

  <!-- 新增 / 更新商品 -->
  <button type="button" class="submit-btn" (click)="submitProduct()">
    {{ editingProductId ? '更新商品' : '新增商品' }}
  </button>
</div>

<div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th>商品</th>
        <th>分類</th>
        <th>HS Code</th>
        <th>價格</th>
        <th>庫存</th>
        <th>庫存狀態</th>
        <th>單位</th>
        <th>操作</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let product of filteredProducts()">
        <td data-label="商品">
          <span class="product-name" [title]="product.productName">
            {{ product.productName }}
          </span>
        </td>

        <td data-label="分類">
          {{ product.categoryName }}
        </td>

        <td data-label="HS Code">
          {{ product.hsCode }}
        </td>

        <td data-label="價格">
          NT$ {{ product.unitPrice | number }}
        </td>

        <td data-label="庫存">
          <span class="stock-badge" [class.low-stock]="product.stockQty <= 10">
            {{ product.stockQty }}
          </span>
        </td>

        <td data-label="庫存狀態">
          <span class="stock-status-badge" [ngClass]="getStockStatusClass(product.stockQty)">
            {{ getStockStatusLabel(product.stockQty) }}
          </span>
        </td>

        <td data-label="單位">
          {{ getUnitLabel(product.unit) }}
        </td>

        <td data-label="操作" class="action-cell">
          <button type="button" class="edit-menu-btn" (click)="toggleActionMenu(product.id)">
            編輯
          </button>

          <div class="action-menu" *ngIf="openedActionId === product.id">
            <button type="button" class="action-update" (click)="editProduct(product); openedActionId = null">
              修改
            </button>

            <button type="button" class="action-delete" (click)="deleteProduct(product.id); openedActionId = null">
              刪除
            </button>
          </div>
        </td>
      </tr>

      <tr *ngIf="filteredProducts().length === 0">
        <td colspan="8" class="empty-row">
          查無商品資料
        </td>
      </tr>
    </tbody>
  </table>
</div>
